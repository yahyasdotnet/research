spring.application.name=research
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration=PT15M
app.web-search.firecrawl-api-key=${FIRECRAWL_API_KEY:}
app.web-search.max-results=5
app.writing-assistant.debounce=PT1S
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:llama3.2}
