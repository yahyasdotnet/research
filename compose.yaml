services:
  research:
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "3000:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/research_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a Base64-encoded secret}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: research_db
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d research_db"]
      interval: 5s
      timeout: 5s
      retries: 10
